<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <script>
      // Applies the saved theme before the page draws. theme.ts keeps it up to date.
      (function () {
        var setting = null;
        try {
          setting = localStorage.getItem("staf.theme");
        } catch (e) {}
        var dark = setting === "dark" || (setting !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = dark ? "#151515" : "#f7f7f5";
      })();
    </script>
    <title>Staf</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23181818'/%3E%3Cpath d='M20.5 10.5c-1-1-2.6-1.5-4.4-1.5-2.9 0-4.8 1.5-4.8 3.6 0 4.6 9.6 2.6 9.6 7.1 0 2.2-2 3.8-5 3.8-2 0-3.8-.6-4.9-1.8' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
